const getSmartFoodUnit = (food) => {
  if (!food) return null;
  if (food.unitName && food.pieceWeight) {
    return { unitName: food.unitName, pieceWeight: Number(food.pieceWeight) };
  }
  const name = (food.name || '').toLowerCase();
  
  if (/\b(ei|eier|rührei|spiegelei|gekochtes ei|gekochte eier)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 55 };
  if (/\b(nugget|nuggets)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 20 };
  if (/\b(banane|bananen)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 120 };
  if (/\b(apfel|äpfel)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 150 };
  if (/\b(birne|birnen)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 160 };
  if (/\b(orange|orangen)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 180 };
  if (/\b(toast|toastbrot)\b/i.test(name)) return { unitName: 'Scheibe', pieceWeight: 30 };
  if (/\b(brot|brotscheibe|graubrot|vollkornbrot)\b/i.test(name)) return { unitName: 'Scheibe', pieceWeight: 45 };
  if (/\b(brötchen|semmel|schrippe)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 60 };
  if (/\b(riegel|proteinriegel|müsliriegel|corny)\b/i.test(name)) return { unitName: 'Riegel', pieceWeight: 45 };
  if (/\b(keks|kekse|cookie|cookies)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 25 };
  if (/\b(burger|cheeseburger|hamburger)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 200 };
  if (/\b(dose|red bull|monster|cola)\b/i.test(name) && !/100/i.test(name)) return { unitName: 'Dose', pieceWeight: 330 };
  if (/\b(flasche|wasser)\b/i.test(name) && !/100/i.test(name)) return { unitName: 'Flasche', pieceWeight: 500 };
  if (/\b(avocado)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 160 };
  if (/\b(becher|joghurtbecher)\b/i.test(name)) return { unitName: 'Becher', pieceWeight: 150 };
  if (/\b(pizzastück|pizza)\b/i.test(name) && !/ganz/i.test(name)) return { unitName: 'Stück', pieceWeight: 120 };
  if (/\b(wiener|würstchen|bratwurst)\b/i.test(name)) return { unitName: 'Stück', pieceWeight: 60 };
  if (food.estimatedPortionWeight) return { unitName: 'Portion', pieceWeight: Number(food.estimatedPortionWeight) };

  return null;
};

const resizeImage = file => {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
};

const triggerHaptic = (type = 'light') => {
  if (typeof navigator !== 'undefined' && navigator.vibrate) {
    if (type === 'success') navigator.vibrate([25, 40, 25]);
    else if (type === 'delete') navigator.vibrate(30);
    else navigator.vibrate(15);
  }
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      if (!window._hapticCtx) {
        window._hapticCtx = new AudioContext();
      }
      const ctx = window._hapticCtx;
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      const now = ctx.currentTime;

      if (type === 'success') {
        // Moderner, glasklarer 2-Ton Erfolgs-Chime (C6 -> G6)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1046.5, now);
        gain1.gain.setValueAtTime(0.035, now);
        gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.12);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(1567.98, now + 0.055);
        gain2.gain.setValueAtTime(0.0001, now);
        gain2.gain.setValueAtTime(0.045, now + 0.055);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.055);
        osc2.stop(now + 0.22);
      } else if (type === 'delete') {
        // Moderner, knackiger Soft-Pop statt dumpfem Brummen
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.045);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.045);
      } else {
        // Moderner, dezenter Micro-Click (Glasklick / Taptic Feedback)
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1600, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.016);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.016);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.016);
      }
    }
  } catch(e) {}
};

const getLocalToday = () => {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().split('T')[0];
};

const parseLocalDate = (dateStr) => {
  if (!dateStr) return new Date();
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
};

const formatLocalDate = (d) => {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

const addDaysToDateStr = (dateStr, days) => {
  const d = parseLocalDate(dateStr);
  d.setDate(d.getDate() + days);
  return formatLocalDate(d);
};

const SwipeableItem = ({ children, onDelete, onSelect, className = "" }) => {
  const [translateX, setTranslateX] = useState(0);
  const [isDragging, setIsDragging] = useState(false);
  const [isDeleting, setIsDeleting] = useState(false);
  const startX = useRef(0);
  const startY = useRef(0);
  const isHorizontal = useRef(null);
  const currentTranslate = useRef(0);

  const handleTouchStart = (e) => {
    startX.current = e.touches[0].clientX;
    startY.current = e.touches[0].clientY;
    isHorizontal.current = null;
    setIsDragging(false);
  };

  const handleTouchMove = (e) => {
    const diffX = e.touches[0].clientX - startX.current;
    const diffY = e.touches[0].clientY - startY.current;

    if (isHorizontal.current === null) {
      if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) {
        // Only lock into horizontal swipe when horizontal intent is distinct
        isHorizontal.current = Math.abs(diffX) > Math.abs(diffY) * 1.25;
      }
    }

    if (isHorizontal.current) {
      if (e.cancelable) e.preventDefault();
      setIsDragging(true);
      if (diffX < 0) {
        const newX = diffX < -110 ? -110 + (diffX + 110) * 0.4 : diffX;
        setTranslateX(newX);
        currentTranslate.current = newX;
        if (newX < -130 && !window._hapticTriggered) {
          triggerHaptic('medium');
          window._hapticTriggered = true;
        }
      } else {
        setTranslateX(diffX * 0.15);
        currentTranslate.current = 0;
      }
    }
  };

  const handleTouchEnd = () => {
    window._hapticTriggered = false;
    setIsDragging(false);
    if (currentTranslate.current < -140) {
      triggerDelete();
    } else if (currentTranslate.current < -50) {
      setTranslateX(-84);
      currentTranslate.current = -84;
      triggerHaptic('light');
    } else {
      setTranslateX(0);
      currentTranslate.current = 0;
    }
  };

  const triggerDelete = () => {
    triggerHaptic('delete');
    setIsDeleting(true);
    setTranslateX(-450);
    setTimeout(() => {
      if (onDelete) onDelete();
    }, 220);
  };

  const handleClick = (e) => {
    if (currentTranslate.current < -10) {
      e.stopPropagation();
      setTranslateX(0);
      currentTranslate.current = 0;
    } else if (!isDragging && onSelect) {
      onSelect();
    }
  };

  const deleteOpacity = isDeleting ? 1 : Math.min(1, Math.max(0, Math.abs(translateX) / 35));

  return html`
    <div className=${`relative mb-3 rounded-[1.8rem] overflow-hidden select-none touch-pan-y transition-all duration-300 ${isDeleting ? 'max-h-0 opacity-0 mb-0 pointer-events-none' : 'max-h-40 opacity-100'} ${className}`}>
      <div 
        className="absolute inset-y-0 right-0 w-full bg-gradient-to-l from-rose-600 via-rose-600 to-rose-700/80 rounded-[1.8rem] flex items-center justify-end px-6 cursor-pointer active:brightness-90 transition-opacity duration-150"
        style=${{
          opacity: deleteOpacity,
          pointerEvents: translateX < -20 ? 'auto' : 'none'
        }}
        onClick=${(e) => { e.stopPropagation(); triggerDelete(); }}
      >
        <div 
          className="flex flex-col items-center gap-1 text-white transition-transform duration-150"
          style=${{
            transform: `scale(${Math.min(1.2, Math.max(0.8, Math.abs(translateX) / 80))})`,
            opacity: Math.min(1, Math.abs(translateX) / 30)
          }}
        >
          <${TrashIcon} size=${22} />
          <span className="text-[9px] font-black uppercase tracking-wider">Löschen</span>
        </div>
      </div>

      <div
        style=${{
          transform: `translateX(${translateX}px)`,
          transition: isDragging ? 'none' : 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)'
        }}
        onTouchStart=${handleTouchStart}
        onTouchMove=${handleTouchMove}
        onTouchEnd=${handleTouchEnd}
        onClick=${handleClick}
        className="relative z-10"
      >
        ${children}
      </div>
    </div>
  `;
};

const AnimatedNumber = ({ value }) => {
  const [display, setDisplay] = useState(value);
  useEffect(() => {
    let start = display;
    let end = value;
    if (start === end) return;
    let duration = 800;
    let startTimestamp = null;
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      setDisplay(Math.floor(start + (end - start) * progress));
      if (progress < 1) window.requestAnimationFrame(step);
      else setDisplay(end);
    };
    window.requestAnimationFrame(step);
  }, [value]);
  return display;
};

const ProgressRing = React.memo(({
  consumed,
  burned = 0,
  target
}) => {
  const baseTarget = Number(target) || 2000;
  const burnedKcal = Math.max(0, Number(burned) || 0);
  const consumedKcal = Math.max(0, Number(consumed) || 0);

  // Synchronized 60fps state animation for smooth simultaneous ring growth
  const [animConsumed, setAnimConsumed] = useState(0);
  const [animBurned, setAnimBurned] = useState(0);

  useEffect(() => {
    let startC = animConsumed;
    let endC = consumedKcal;
    let startB = animBurned;
    let endB = burnedKcal;
    let duration = 850;
    let startTimestamp = null;

    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      // Silky smooth cubic ease-out
      const ease = 1 - Math.pow(1 - progress, 3);
      setAnimConsumed(startC + (endC - startC) * ease);
      setAnimBurned(startB + (endB - startB) * ease);

      if (progress < 1) {
        window.requestAnimationFrame(step);
      } else {
        setAnimConsumed(endC);
        setAnimBurned(endB);
      }
    };
    window.requestAnimationFrame(step);
  }, [consumedKcal, burnedKcal]);

  const effectiveTarget = baseTarget + animBurned;
  const radius = 88;
  const strokeW = 12;
  const normRadius = radius - strokeW / 2;
  const circ = normRadius * 2 * Math.PI;

  const baseRatio = effectiveTarget > 0 ? (baseTarget / effectiveTarget) : 1;
  const sportRatio = effectiveTarget > 0 ? (animBurned / effectiveTarget) : 0;

  // 1. Gelber Sport-Bereich am ENDE des Rings (z.B. die letzten 300 kcal)
  const sportArcLength = Math.max(0.001, sportRatio * circ);
  const sportArcOffset = -(baseRatio * circ);

  // 2. Gegessene Kalorien (Lila, füllt sich von 0 Uhr im Uhrzeigersinn)
  const rawConsumedRatio = effectiveTarget > 0 ? Math.min(animConsumed / effectiveTarget, 1) : 0;
  const consumedArcLength = rawConsumedRatio * circ;

  // 3. Überschreitung (Rot, falls über Basis + Sport hinaus)
  const isExceededEffective = animConsumed > effectiveTarget;
  const excessKcal = isExceededEffective ? animConsumed - effectiveTarget : 0;
  const excessArcLength = effectiveTarget > 0 ? Math.min((excessKcal / effectiveTarget) * circ, circ) : 0;

  const diffWithSport = (baseTarget + burnedKcal) - consumedKcal;

  return html`<div className="relative flex flex-col items-center justify-center">
      <div className="relative flex items-center justify-center">
        <svg className="relative z-10 transform -rotate-90" height=${radius * 2} width=${radius * 2}>
          <!-- Grauer Basis-Hintergrundkreis (Alle noch freien Kalorien sind standardmäßig grau) -->
          <circle
            stroke="#1e293b"
            strokeWidth=${strokeW}
            fill="transparent"
            r=${normRadius}
            cx=${radius}
            cy=${radius}
          />
          
          <!-- Gelber Sport-Balken am ENDE des Rings (Zusätzlicher Platz durch Sport) -->
          ${animBurned > 0.5 && html`
            <circle
              stroke="#fbbf24"
              strokeWidth=${strokeW}
              strokeDasharray="${sportArcLength} ${circ}"
              strokeDashoffset=${sportArcOffset}
              strokeLinecap="round"
              fill="transparent"
              r=${normRadius}
              cx=${radius}
              cy=${radius}
            />
          `}

          <!-- Lila Balken für gegessene Kalorien (Wandert über Grau und bei Bedarf ins Gelb) -->
          ${consumedArcLength > 0.5 && html`
            <circle
              stroke="#8b5cf6"
              strokeWidth=${strokeW}
              strokeDasharray="${consumedArcLength} ${circ}"
              strokeDashoffset="0"
              strokeLinecap="round"
              fill="transparent"
              r=${normRadius}
              cx=${radius}
              cy=${radius}
            />
          `}

          <!-- Roter Überschuss-Bogen (nur bei Überschreitung des Gesamtbudgets) -->
          ${isExceededEffective && excessArcLength > 0.5 && html`
            <circle
              stroke="#ef4444"
              strokeWidth=${strokeW}
              strokeDasharray="${excessArcLength} ${circ}"
              strokeDashoffset="0"
              strokeLinecap="round"
              fill="transparent"
              r=${normRadius}
              cx=${radius}
              cy=${radius}
            />
          `}
        </svg>

        <div className="absolute text-center flex flex-col items-center justify-center px-2">
          <div className=${`text-3xl sm:text-4xl font-black tracking-tighter leading-none ${consumedKcal > (baseTarget + burnedKcal) ? 'text-rose-500' : 'text-white'}`}>
            <${AnimatedNumber} value=${Math.round(consumedKcal)} />
          </div>
          <div className="text-[10px] font-bold text-slate-400 mt-1 flex items-center justify-center gap-1">
            <span>von ${Math.round(baseTarget + burnedKcal)} kcal</span>
          </div>

          <div className=${`text-[10px] font-black uppercase tracking-wider mt-1.5 ${
            diffWithSport < 0 ? 'text-rose-500' : 'text-emerald-400'
          }`}>
            ${diffWithSport < 0 ? `${Math.abs(Math.round(diffWithSport))} kcal drüber` : `${Math.round(diffWithSport)} kcal übrig`}
          </div>
        </div>
      </div>

      ${burnedKcal > 0 ? html`
        <div className="mt-4 w-full">
          <!-- 4-Spalten Rechenleiste -->
          <div className="grid grid-cols-4 items-center bg-slate-900/90 rounded-2xl p-3 border border-white/5 shadow-inner text-center">
            <div className="space-y-0.5">
              <div className="text-[8px] font-black uppercase text-slate-500 tracking-wider">Basis</div>
              <div className="text-xs font-black text-white">${baseTarget}</div>
            </div>
            <div className="space-y-0.5">
              <div className="text-[8px] font-black uppercase text-amber-400 tracking-wider">+ Sport</div>
              <div className="text-xs font-black text-amber-400">+${Math.round(burnedKcal)}</div>
            </div>
            <div className="space-y-0.5">
              <div className="text-[8px] font-black uppercase text-brand-400 tracking-wider">- Gegessen</div>
              <div className="text-xs font-black text-brand-300">-${Math.round(consumedKcal)}</div>
            </div>
            <div className="space-y-0.5 border-l border-white/10 pl-1">
              <div className="text-[8px] font-black uppercase text-emerald-400 tracking-wider">= Noch übrig</div>
              <div className=${`text-xs font-black ${diffWithSport < 0 ? 'text-rose-500' : 'text-emerald-400'}`}>
                ${diffWithSport < 0 ? `-${Math.abs(Math.round(diffWithSport))}` : Math.round(diffWithSport)}
              </div>
            </div>
          </div>
        </div>
      ` : null}
    </div>`;
});
const MacroBar = ({
  label,
  value,
  target,
  color
}) => {
  const rawPercent = value / (target || 1) * 100 || 0;
  const isExceeded = rawPercent > 100;
  const mainPercent = Math.min(rawPercent, 100);

  return html`<div className="space-y-1.5"><div className="flex justify-between items-end px-1"><span className=${`text-[9px] font-black uppercase tracking-wider ${textColorClass}`}>${label}</span><span className=${`text-[10px] font-black ${isExceeded ? 'text-rose-500' : textColorClass}`}>${Math.round(value)}g <span className=${isExceeded ? 'font-black' : 'font-bold'}>/ ${target}g</span></span></div><div className="h-1.5 w-full bg-slate-800/50 rounded-full overflow-hidden relative"><div className=${`h-full ${color} rounded-full transition-all duration-1000 absolute top-0 left-0`} style=${{
    width: `${mainPercent}%`
  }}/>${isExceeded && html`<div className="h-full bg-rose-500 rounded-full transition-all duration-1000 absolute top-0 left-0" style=${{
    width: `${excessPercent}%`
  }}/>`}</div></div>`;
};
const SubMacroRow = ({

const GoalInput = ({

  }} className=${`w-full p-3 bg-slate-900 border rounded-xl font-black text-lg outline-none focus:ring-2 focus:ring-brand-500/50 ${color} ${saved ? 'border-emerald-500/60 shadow-[0_0_18px_rgba(16,185,129,0.35)] ring-1 ring-emerald-500/40' : 'border-white/5 shadow-inner'} transition-all duration-500`}/></div>`;
};

        history: JSON.parse(localStorage.getItem('kTrackHistory') || '[]'),
        activityHistory: JSON.parse(localStorage.getItem('kTrackActivityHistory') || '[]'),
        logs: JSON.parse(localStorage.getItem('kTrackAllLogs') || '{}'),
        recipes: JSON.parse(localStorage.getItem('kTrackRecipes') || '[]'),
      };
      const oldLogRaw = localStorage.getItem('kTrackLog');
      if (oldLogRaw && oldLogRaw !== "null") data.oldLog = JSON.parse(oldLogRaw);
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'kalorien_tracker_backup.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }} className="flex-1 bg-slate-800/50 border border-white/10 text-white py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest active:bg-slate-800 transition-all">Exportieren</button>
    <button onClick=${() => document.getElementById('import-file').click()} className="flex-1 bg-slate-800/50 border border-white/10 text-white py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest active:bg-slate-800 transition-all">Importieren</button>
    <input type="file" id="import-file" accept=".json" className="hidden" onChange=${(e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.user) localStorage.setItem('kTrackUser', JSON.stringify(data.user));
          if (data.aiGoalForm) localStorage.setItem('kTrackAiGoalForm', JSON.stringify(data.aiGoalForm));
          if (data.history) localStorage.setItem('kTrackHistory', JSON.stringify(data.history));
          if (data.activityHistory) localStorage.setItem('kTrackActivityHistory', JSON.stringify(data.activityHistory));
          if (data.logs) localStorage.setItem('kTrackAllLogs', JSON.stringify(data.logs));
          if (data.recipes) localStorage.setItem('kTrackRecipes', JSON.stringify(data.recipes));
          alert("Erfolgreich importiert!");
          window.location.reload();
        } catch(err) {
          alert("Fehler beim Import: Ungültige Datei");
        }
      };
      reader.readAsText(file);
    }}/>
  </div>
  </div></div>`}${isScanning && html`<div className="fixed inset-0 bg-slate-950 z-[300] flex flex-col items-center justify-center p-6 backdrop-blur-3xl animate-in zoom-in duration-300"><div className="w-full max-w-md glass-card rounded-[3rem] overflow-hidden border border-white/10 shadow-2xl"><div className="flex justify-between items-center p-8 bg-slate-900/50"><h3 className="font-black text-xl text-white flex items-center gap-3"><${BarcodeIcon} size=${24} className="text-brand-400"/> Scan</h3><div className="flex items-center gap-2"><button onClick=${toggleTorch} className=${`p-3 rounded-full transition-all ${isTorchOn ? 'bg-amber-400 text-slate-950 shadow-[0_0_15px_rgba(251,191,36,0.6)]' : 'bg-slate-800 text-slate-300'}`} title="Taschenlampe"><${FlashlightIcon} size=${18}/></button><button onClick=${stopBarcodeScan} className="p-2 bg-slate-800 rounded-full active:scale-90 transition-all text-white"><${XIcon} size=${20}/></button></div></div><div className="p-6"><div id="qr-reader" className="w-full aspect-square rounded-3xl overflow-hidden border-4 border-slate-900 shadow-inner"/><p className="text-center text-[10px] font-black text-slate-500 uppercase tracking-widest mt-4">Handy etwas weiter weg halten für Fokus</p></div></div></div>`}

${showCalendarModal && (() => {
  const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
  const firstDayOfMonth = new Date(calendarYear, calendarMonth, 1).getDay();
  const startOffset = (firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1);
  
  const days = [];
  for (let i = 0; i < startOffset; i++) days.push(null);
  for (let i = 1; i <= daysInMonth; i++) days.push(i);

  const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

  return html`
    <div className="fixed inset-0 bg-slate-950/95 z-[400] backdrop-blur-xl animate-in fade-in duration-300" onClick=${() => setShowCalendarModal(false)}/>
    <div className="fixed bottom-4 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-md z-[410] glass-card rounded-[3rem] p-6 space-y-4 animate-in slide-up duration-300 shadow-2xl border border-white/10 max-h-[90vh] overflow-y-auto">
      <div className="flex justify-between items-center mb-2">
        <button onClick=${() => {
          if (calendarMonth === 0) { setCalendarMonth(11); setCalendarYear(calendarYear - 1); }
          else { setCalendarMonth(calendarMonth - 1); }
        }} className="p-3 bg-slate-800 rounded-full active:scale-90 transition-all"><${ArrowLeftIcon} size=${16}/></button>
        <h3 className="text-lg font-black text-white">${monthNames[calendarMonth]} ${calendarYear}</h3>
        <button onClick=${() => {
          if (calendarMonth === 11) { setCalendarMonth(0); setCalendarYear(calendarYear + 1); }
          else { setCalendarMonth(calendarMonth + 1); }
        }} className="p-3 bg-slate-800 rounded-full active:scale-90 transition-all"><${ArrowRightIcon} size=${16}/></button>
      </div>
      
      <div className="grid grid-cols-7 gap-2 text-center mb-2">
        ${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => html`<div key=${d} className="text-[10px] font-black text-slate-500 uppercase">${d}</div>`)}
      </div>
      
      <div className="grid grid-cols-7 gap-2">
        ${days.map((day, idx) => {
          if (!day) return html`<div key=${'empty-'+idx} className="aspect-square"/>`;
          const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const hasEntries = allLogs[dateStr] && allLogs[dateStr].items && allLogs[dateStr].items.length > 0;
          const isSelected = selectedDate === dateStr;
          const isToday = dateStr === getLocalToday();
          
          let baseClass = "relative aspect-square flex flex-col items-center justify-center rounded-2xl text-sm active:scale-90 transition-all border ";
          
          if (isSelected) {
            baseClass += "bg-brand-500 text-slate-950 font-black border-brand-500 shadow-[0_0_15px_rgba(139,92,246,0.5)]";
          } else if (hasEntries) {
            baseClass += "bg-brand-500/20 text-brand-400 font-bold border-brand-500/30";
          } else {
            baseClass += "bg-slate-900/50 text-slate-400 font-bold border-white/5";
          }
          
          return html`
            <button key=${dateStr} onClick=${() => {
              triggerHaptic('light');
              setSelectedDate(dateStr);
              setShowCalendarModal(false);
            }} className=${baseClass}>
              <span>${day}</span>
              ${isToday && html`<span className="absolute bottom-1 w-1 h-1 rounded-full bg-current"/>`}
            </button>
          `;
        })}
      </div>
    </div>
  `;
})()}

${showAiCoach && html`
  <div className="fixed inset-0 bg-slate-950/95 z-[400] flex items-center justify-center p-4 sm:p-6 backdrop-blur-xl animate-in fade-in duration-300" onClick=${() => !isAiCoachLoading && setShowAiCoach(false)}>
    <div className="w-full max-w-md glass-card rounded-[2.5rem] p-6 space-y-5 animate-in zoom-in duration-200 overflow-y-auto max-h-[85vh]" onClick=${e => e.stopPropagation()}>
      <div className="flex justify-between items-center">
        <h3 className="text-xl font-black flex items-center gap-3"><${SparklesIcon} className="text-brand-400"/> Ernährungs-Coach</h3>
        <button onClick=${() => !isAiCoachLoading && setShowAiCoach(false)} className="p-2 bg-slate-800 rounded-full active:opacity-80"><${XIcon} size=${20}/></button>
      </div>
      
      ${!aiCoachResult && !isAiCoachLoading && html`
        <div className="space-y-6">
          <div className="flex items-center justify-center gap-5 w-full my-2">
            <div className="w-36 shrink-0 space-y-1.5 text-center">
              <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest block">Von</label>
              <input type="date" value=${aiCoachStart} onChange=${e => setAiCoachStart(e.target.value)} className="w-full py-2.5 px-2 bg-slate-900 border border-white/15 rounded-2xl text-white outline-none text-xs font-semibold text-center shadow-inner focus:ring-2 focus:ring-brand-500/50 block"/>
            </div>
            <div className="w-36 shrink-0 space-y-1.5 text-center">
              <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest block">Bis</label>
              <input type="date" value=${aiCoachEnd} onChange=${e => setAiCoachEnd(e.target.value)} className="w-full py-2.5 px-2 bg-slate-900 border border-white/15 rounded-2xl text-white outline-none text-xs font-semibold text-center shadow-inner focus:ring-2 focus:ring-brand-500/50 block"/>
            </div>
          </div>
          <button onClick=${runAiCoach} className="w-full py-5 bg-brand-500 text-slate-950 rounded-[2rem] font-black uppercase tracking-widest flex items-center justify-center gap-3 active:scale-95 transition-all shadow-xl">Analyse starten</button>
        </div>
      `}
      
      ${isAiCoachLoading && html`
        <div className="py-12 flex flex-col items-center justify-center space-y-4">
          <${LoaderIcon} size=${40} className="text-brand-500"/>
          <p className="text-sm font-bold text-slate-400 animate-pulse">Analysiere Ernährung...</p>
        </div>
      `}
      
      ${aiCoachResult && html`
        <div className="space-y-6 animate-in zoom-in duration-500">
          <div className="flex flex-col items-center justify-center p-6 bg-slate-900/50 rounded-[2rem] border border-white/5 relative overflow-hidden">
            <div className="absolute inset-0 bg-brand-500/10 blur-xl"/>
            <div className="relative text-5xl font-black text-white mb-2" style=${{ color: (aiCoachResult.score || 0) >= 80 ? '#10b981' : (aiCoachResult.score || 0) >= 50 ? '#f59e0b' : '#ef4444' }}>
              ${aiCoachResult.score ?? 0}<span className="text-lg opacity-50">/100</span>
            </div>
            <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">${aiCoachResult.verdict || "Analyse abgeschlossen"}</div>
          </div>
          
          <div className="grid gap-4">
            <div className="p-5 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl space-y-2">
              <h4 className="text-xs font-black text-emerald-400 uppercase tracking-widest flex items-center gap-2"><${CheckIcon} size=${14}/> Das war top</h4>
              <ul className="text-sm text-slate-300 space-y-1 list-disc pl-4 marker:text-emerald-500/50">
                ${(Array.isArray(aiCoachResult.good) ? aiCoachResult.good : []).map(g => html`<li key=${g}>${g}</li>`)}
              </ul>
            </div>
            
            <div className="p-5 bg-rose-500/10 border border-rose-500/20 rounded-2xl space-y-2">
              <h4 className="text-xs font-black text-rose-400 uppercase tracking-widest flex items-center gap-2"><${XIcon} size=${14}/> Das geht besser</h4>
              <ul className="text-sm text-slate-300 space-y-1 list-disc pl-4 marker:text-rose-500/50">
                ${(Array.isArray(aiCoachResult.bad) ? aiCoachResult.bad : []).map(b => html`<li key=${b}>${b}</li>`)}
              </ul>
            </div>
            
            <div className="p-5 bg-brand-500/10 border border-brand-500/20 rounded-2xl space-y-2">
              <h4 className="text-xs font-black text-brand-400 uppercase tracking-widest flex items-center gap-2">💡 Tipps für dich</h4>
              <ul className="text-sm text-slate-300 space-y-1 list-disc pl-4 marker:text-brand-500/50">
                ${(Array.isArray(aiCoachResult.tips) ? aiCoachResult.tips : []).map(t => html`<li key=${t}>${t}</li>`)}
              </ul>
            </div>
          </div>
          <button onClick=${() => setAiCoachResult(null)} className="w-full py-4 text-slate-500 font-bold text-xs uppercase tracking-widest bg-slate-800 rounded-2xl active:scale-95 transition-all">Neue Analyse</button>
        </div>
      `}
    </div>
  </div>
`}

</div>`;
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(html`<${App}/>`);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration:', err));
  });
}
    </script>
</body>
</html>
