const resizeImage = file => {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
};

// --- COMPONENTS ---

const getLocalToday = () => {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().split('T')[0];
};

const AnimatedNumber = ({ value }) => {
  const [display, setDisplay] = useState(value);
  useEffect(() => {
    let start = display;
    let end = value;
    if (start === end) return;
    let duration = 800;
    let startTimestamp = null;
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      setDisplay(Math.floor(start + (end - start) * progress));
      if (progress < 1) window.requestAnimationFrame(step);
      else setDisplay(end);
    };
    window.requestAnimationFrame(step);
  }, [value]);
  return display;
};

const ProgressRing = React.memo(({
  consumed,
  target
}) => {
  const radius = 80;
  const normRadius = radius - 12;
  const circ = normRadius * 2 * Math.PI;
  const rawPercent = consumed / (target || 1) * 100 || 0;
  let glowColor = "rgba(139, 92, 246, 0.3)";
  if (rawPercent > 85) glowColor = "rgba(245, 158, 11, 0.4)";
  if (rawPercent > 100) glowColor = "rgba(239, 68, 68, 0.5)";
  const isExceeded = rawPercent > 100;
  const mainPercent = Math.min(rawPercent, 100);
  const mainOffset = circ - mainPercent / 100 * circ;
  const excessPercent = isExceeded ? Math.min(rawPercent - 100, 100) : 0;
  const excessOffset = circ - excessPercent / 100 * circ;
  const diff = target - consumed;
  return html`<div className="relative flex items-center justify-center">
      
      <svg className="relative z-10 transform -rotate-90" height=${radius * 2} width=${radius * 2} className="transform -rotate-90"><circle stroke="#1e293b" strokeWidth=${12} fill="transparent" r=${normRadius} cx=${radius} cy=${radius}/><circle stroke="#8b5cf6" strokeWidth=${12} strokeDasharray=${circ} style=${{
    strokeDashoffset: mainOffset,
    transition: 'stroke-dashoffset 0.8s'
  }} strokeLinecap="round" fill="transparent" r=${normRadius} cx=${radius} cy=${radius}/>${isExceeded && html`<circle stroke="#ef4444" strokeWidth=${12} strokeDasharray=${circ} style=${{
    strokeDashoffset: excessOffset,
    transition: 'stroke-dashoffset 0.8s'
  }} strokeLinecap="round" fill="transparent" r=${normRadius} cx=${radius} cy=${radius}/>`}</svg><div className="absolute text-center"><div className=${`text-3xl font-black tracking-tighter ${isExceeded ? 'text-rose-500' : 'text-white'}`}><${AnimatedNumber} value=${Math.round(consumed)} /></div><div className=${`text-[9px] font-black uppercase tracking-widest ${diff < 0 ? 'text-rose-500' : 'text-slate-500'}`}>${diff < 0 ? `${Math.abs(Math.round(diff))} kcal drüber` : `${Math.round(diff)} kcal übrig`}</div></div></div>`;
});
const MacroBar = ({
  label,
  value,
  target,
  color
}) => {
  const rawPercent = value / (target || 1) * 100 || 0;
  const isExceeded = rawPercent > 100;
  const mainPercent = Math.min(rawPercent, 100);
  const excessPercent = isExceeded ? Math.min(rawPercent - 100, 100) : 0;
  const textColorClass = color ? color.replace('bg-', 'text-') : 'text-white';
  return html`<div className="space-y-1.5"><div className="flex justify-between items-end px-1"><span className=${`text-[9px] font-black uppercase tracking-wider ${textColorClass}`}>${label}</span><span className=${`text-[10px] font-black ${isExceeded ? 'text-rose-500' : textColorClass}`}>${Math.round(value)}g <span className=${isExceeded ? 'font-black' : 'font-bold'}>/ ${target}g</span></span></div><div className="h-1.5 w-full bg-slate-800/50 rounded-full overflow-hidden relative"><div className=${`h-full ${color} rounded-full transition-all duration-1000 absolute top-0 left-0`} style=${{
    width: `${mainPercent}%`
  }}/>${isExceeded && html`<div className="h-full bg-rose-500 rounded-full transition-all duration-1000 absolute top-0 left-0" style=${{
    width: `${excessPercent}%`
  }}/>`}</div></div>`;
};

const GoalInput = ({
  label,

}) => {
  const [saved, setSaved] = useState(false);

    const val = e.target.value;
    handleChange(val === '' ? 0 : Number(val));
  }} className=${`w-full p-3.5 bg-slate-900 border border-white/5 rounded-xl font-black text-lg outline-none focus:ring-2 focus:ring-brand-500/50 shadow-inner ${color}`}/></div>`;
};

  const days = [];
  for (let i = 0; i < startOffset; i++) days.push(null);
  for (let i = 1; i <= daysInMonth; i++) days.push(i);

      </div>
      
      <div className="grid grid-cols-7 gap-2">
        ${days.map((day, idx) => {
          if (!day) return html`<div key=${'empty-'+idx} className="aspect-square"/>`;

          } else {
            baseClass += "bg-slate-900/50 text-slate-400 font-bold border-white/5";
          }
          
          return html`
            <button key=${dateStr} onClick=${() => {
              setSelectedDate(dateStr);
              setShowCalendarModal(false);
            }} className=${baseClass}>
              ${day}
              ${isToday && !isSelected ? html`<div className="w-1 h-1 bg-white rounded-full mt-0.5 absolute bottom-1.5"/>` : ''}
